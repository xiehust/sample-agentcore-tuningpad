id: multi_harness
name: {en: "Multi-harness (SmolDataEnvs data analysis)", zh-CN: "多 Harness（SmolDataEnvs 数据分析）"}
description:
  en: "Trains one model inside unmodified agent harnesses (Claude Code, OpenCode, Mini-SWE-Agent) on SmolDataEnvs data-analysis tasks. Each Task's own verifier grades the answer after the harness exits; correct answers earn a small bonus for fewer tool calls. Rollouts use the gateway's linear history mode by default: history a harness rewrote (repaired tool calls, re-spacing) is replaced by the model's original output; a run can choose tree to train on exactly what the harness sent. Claude Code is not open source: it is installed from npm under Anthropic's terms, which you need to review yourself."
  zh-CN: "在不修改的 agent harness（Claude Code、OpenCode、Mini-SWE-Agent）里，用 SmolDataEnvs 数据分析任务训练同一个模型。Harness 退出后由 Task 自带的 Verifier 给答案打分；答对时工具调用越少，加分越多。rollout 默认使用 gateway 的 linear history 模式：harness 改写过的历史（修复的工具调用、空白调整）会换回模型的原始输出；run 可以改选 tree，按 harness 实际发送的内容训练。Claude Code 不是开源软件，从 npm 安装并受 Anthropic 条款约束，请自行确认。"
contract: verl-v2
verified: false
params:
  - key: harnesses
    type: multiselect
    label: {en: "Harnesses installed in the image", zh-CN: "镜像中安装的 Harness"}
    options: [claude_code, opencode, mini_swe_agent]
    default: [claude_code]
  - key: tool_bonus_cap
    type: number
    label: {en: "Tool-efficiency bonus cap", zh-CN: "工具效率加分上限"}
    default: 0.1
    min: 0
    max: 0.5
  - key: tool_call_budget
    type: number
    label: {en: "Tool calls at which the bonus reaches 0", zh-CN: "加分降为 0 的工具调用次数"}
    default: 40
    min: 1
    max: 1000
  - key: harness_max_turns
    type: number
    label: {en: "Harness turn limit (kept looser than the gateway cap)", zh-CN: "Harness 自身的轮数上限（比 gateway 上限宽松）"}
    default: 200
    min: 1
    max: 10000
  - key: smoke_bedrock_model
    type: text
    label: {en: "Bedrock model Claude Code uses in the smoke test", zh-CN: "smoke test 中 Claude Code 使用的 Bedrock 模型"}
    default: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
payload:
  prompt_field: null           # payload carries S3 URIs; the prompt column is the Task instruction
  required: [task_id, task_uri, input_uri]
  explicit_prompt_column: true
dataset: {builtin: smoldataenvs}
agent_loop:
  max_tokens_per_turn: 4096
  max_rollout_time: 1200
  tps_limit: 8
  # linear: the gateway generates on its own served tokens for earlier turns, so history a
  # harness rewrote (repaired tool calls, re-spacing) is replaced by the model's original
  # output; compaction and subagents still become separate training rows. A run can pick
  # tree (advanced params) to train on exactly what the harness sent, at several times the
  # training tokens for Claude Code.
  history_mode: linear
  linear_on_nonlinear: reset
  # the one hard limit per rollout (429 past it); harness_max_turns stays looser
  max_turns_per_sid: 40
  # harnesses send their own temperature/top_p: sample with the trainer's instead
  override_client_sampling: true
  # the Agent's result metrics verl reports (validation: per Harness, as val-aux/<harness>/...)
  reward_extra_info_defaults: {correct: 0.0, tool_calls: 0.0}
smoke_payloads: []             # filled from the generated dataset (first two val rows)
# The toolkit caps a session's whole context at max_response_length (prompt overflow moves
# into the response region), so 65536 is the real per-rollout context budget here.
presets:
  - id: qwen35-4b-fsdp-lora-claude-code
    label: {en: "Qwen3.5-4B · 8×H100 · FSDP LoRA · Claude Code (not verified)", zh-CN: "Qwen3.5-4B · 8×H100 · FSDP LoRA · Claude Code（未验证）"}
    model_id: Qwen/Qwen3.5-4B
    instance_type: p5.48xlarge
    nodes: 1
    prefer: fsdp
    tuning: lora
    params: {train_batch_size: 16, rollout_n: 8, lr: 2.0e-5, total_epochs: 1, max_model_len: 65536, max_prompt_length: 32768, max_response_length: 65536, kl_loss_coef: 0.001, save_freq: 10, test_freq: 10, val_n: 1, gpu_memory_utilization: 0.5, enable_thinking: false}
